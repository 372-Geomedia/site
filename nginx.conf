server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Relative Location headers, so redirects keep Traefik's https scheme.
    absolute_redirect off;
    rewrite ^(.+)/$ $1 permanent;

    # Pages are exported as /about.html, /work/coastal-response.html, etc.
    # Client-side navigation requests the same URL with an `RSC: 1` header and
    # expects the matching exported .rsc payload instead of the HTML.
    location / {
        if ($http_rsc) {
            rewrite ^/$ /index.rsc last;
            rewrite ^(.+)$ $1.rsc last;
        }
        try_files $uri $uri.html $uri/index.html =404;
    }

    # The router rejects any content type other than text/x-component and
    # falls back to full page loads.
    location ~ \.rsc$ {
        types { }
        default_type text/x-component;
        add_header Vary RSC;
    }

    # Content-hashed build output never changes, so cache it indefinitely.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ /\. {
        deny all;
    }

    error_page 404 /404.html;
}
